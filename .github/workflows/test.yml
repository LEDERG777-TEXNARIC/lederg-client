name: Launcher tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run client update, radio sync and launcher tests
        run: python -m unittest -v test_client_updates test_radio_sync test_radio_runtime test_folder_download test_launcher
